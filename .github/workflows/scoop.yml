name: Scoop package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bucket/acceptance-desk.json'
      - '.github/workflows/scoop.yml'

permissions:
  contents: read

jobs:
  scoop:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and uninstall the public Windows release
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1' -OutFile $bootstrap
          $scoopRoot = Join-Path $env:RUNNER_TEMP 'scoop'
          $env:SCOOP = $scoopRoot
          & $bootstrap -ScoopDir $scoopRoot -RunAsAdmin
          $scoop = Join-Path $scoopRoot 'shims/scoop.ps1'

          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            & $scoop install (Resolve-Path 'bucket/acceptance-desk.json').Path
          } else {
            & $scoop bucket add acceptance-desk "https://github.com/$env:GITHUB_REPOSITORY.git"
            if ($LASTEXITCODE) { throw "Scoop bucket add failed: $LASTEXITCODE" }
            & $scoop install acceptance-desk/acceptance-desk
          }
          if ($LASTEXITCODE) { throw "Scoop install failed: $LASTEXITCODE" }
          $app = Join-Path $scoopRoot 'apps/acceptance-desk/current/AcceptanceDesk.exe'
          if (!(Test-Path $app)) { throw 'Scoop did not install AcceptanceDesk.exe' }

          & $scoop uninstall acceptance-desk
          if ($LASTEXITCODE -or (Test-Path $app)) { throw 'Scoop did not uninstall Acceptance Desk' }
