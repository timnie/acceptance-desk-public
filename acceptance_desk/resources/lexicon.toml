# 规则特征词表 v0.1.1（与 docs/schema.md 接口 v0.1 配套）
# 位置：acceptance_desk/resources/lexicon.toml（随包发布，由 acceptance_desk.lexicon.load_lexicon() 读取）
#
# 用途：命中结果只作为分类器特征和“审阅候选原因”，不直接决定标签。
# 只收通用中文词，不含任何论文原文。
#
# 匹配规则（实现必须遵守，见 docs/schema.md §5）：
# 1. 在一处修改的原文片段、改文片段上分别匹配，位置记为全文字符下标。
# 2. 所有类别的词与模板合在一起做“最左最长、不重叠”匹配：
#    从左到右扫描，同一起点取最长的命中；已被命中的字符不再参与其他匹配。
#    例：“在一定程度上”整体算 qualifiers，其中的“一定”不再算 certainty。
# 3. [ignore] 里的词也参与最左最长匹配，命中后直接丢弃，用来挡掉误报。
#    例：“相关研究”命中 ignore，其中的“相关”不算 correlation。
# 4. 含“…”的条目是模板：按“…”切成若干段，各段按字面依次出现，
#    段与段之间隔 0 到 matching.max_gap 个字符，且间隔里不含 matching.gap_stop 中的字符（与句子边界一致，不跨句）；
#    命中文本包含间隔，长度按整个命中文本计算，参与第 2 条的“最长”比较。
# 5. 比较的是次数：同一词在原文和改文中各出现几次，差值进入 delta；
#    “删去”“新增”列表按差值展开，不按“有没有”判断。

version = "0.2"

[matching]
strategy = "leftmost_longest"
max_gap = 12
gap_stop = "。！？!?\n"

[qualifiers]
# 限定词 / hedge：次数减少 → hedge_removed（论证变强信号）；次数增加 → hedge_added（论证变弱信号）
words = [
  "可能", "或许", "也许", "大概", "大致", "似乎", "看起来", "或可",
  "在一定程度上", "一定程度上", "某种程度上", "部分地",
  "一般而言", "一般来说", "通常", "往往", "多数情况下", "在…条件下",
  "初步", "初步表明", "倾向于", "有望", "可望", "暗示",
  "尚需", "有待", "有待进一步验证", "据推测", "推测",
  # 0.1.2：范围限定。删去后所指范围变宽或定义改变（如“不是单纯的 X”“主要指 X”）
  "主要", "纯粹", "单纯",
]

[certainty]
# 确定性强化词：次数增加 → certainty_added（论证变强信号）
words = [
  "必然", "必定", "一定", "显然", "明显", "毫无疑问", "无疑", "毋庸置疑",
  "证明", "证实", "充分说明", "彻底", "完全", "根本上", "从根本上",
  "始终", "总是", "唯一", "绝对", "直接", "决定性", "不可能",
]

[correlation]
# 相关类表述。causal_upgrade 的判定见 schema.md §5.4：correlation 次数减少且 causal 次数增加
words = ["相关", "有关", "关联", "相联系", "伴随", "共变", "同时出现"]

[causal]
# 因果谓词：断言 A 引起 B。不含连接词（见 [connective]）
words = [
  "导致", "造成", "引起", "引发", "使得", "促使", "决定了", "带来了",
  "归因于", "是…的原因", "是…的结果",
]

[connective]
# 因果 / 推论连接词：只记录增减（connective_added / connective_removed），
# 单独出现时不触发 causal_upgrade。是否构成新推论由标注员判断（标注手册 §5）
words = ["因此", "因而", "从而", "所以", "于是", "由此", "进而", "故而", "由于", "可见"]

[defensive]
# 防御性写作 / 各打五十大板：次数增加 → defensive_added（论证变弱信号）
words = [
  "当然", "诚然", "不可否认", "不容否认", "也要看到", "也应看到", "同时也要注意",
  "不能一概而论", "辩证地看", "辩证地看待", "客观地说", "并非绝对", "仍存在一定局限",
  "既有…也有", "在肯定…的同时", "虽然…但也",
]

[slop]
# AI 套话：次数增加 → slop_added（AI slop 信号）。
# 其中“综上所述”“总之”在学术写作里也常见，由分类器学权重，词表不区分轻重
words = [
  "值得注意的是", "值得一提的是", "需要指出的是", "不难看出", "由此可见",
  "总而言之", "综上所述", "总的来说", "总之", "众所周知",
  "在当今社会", "在当今时代", "随着…的不断发展", "随着…的快速发展", "随着…的发展",
  "具有重要意义", "具有重要的理论意义和现实意义", "发挥着重要作用", "起到了…的作用",
  "产生了深远影响", "提供了有力支撑", "奠定了坚实基础", "注入了新的活力",
  "多维度", "全方位", "多层次", "深层次", "赋能", "助力", "抓手",
  "不仅…而且…更", "首先…其次…最后",
]

[attribution]
# 0.2：归因。次数增加 → attribution_added（新增归因：把一句话归到某人名下，需核对原文有无依据）
# 只收带两端字面的模板，避免把普通的“认为”“指出”都算进来
words = [
  "用…的话说", "借用…的话说", "借…的话说", "按…的说法", "按照…的说法", "照…的说法",
  "正如…所说", "正如…所言", "正如…指出", "如…所说", "如…所言", "在…看来",
]

[ignore]
# 命中后丢弃：词表里的词作为普通名词、术语或固定搭配出现的情况
words = [
  "可能性", "尽可能", "不可能性",
  "相关研究", "相关文献", "相关工作", "相关部门", "相关政策", "相关系数", "相关性分析",
  "有关研究", "有关部门", "有关规定",
  "一定数量", "一定的", "做出决定", "决定权",
  "证明材料",
]

[patterns]
# Python re 语法。先匹配引用，再在引用以外的位置匹配数字（引用里的编号不算数字）。
# 数字保留正负号：前面不是数字、字母或小数点时，- + −（U+2212）－ ＋ ﹣ 算作符号；
# 因此“1-3”“2019-2020年”“COVID-19”里的连字符不算负号，范围按两端分别提取。
# 科学计数法（1.5e-3、3×10^5）整体提取。
# 中文数量：只识别带明确量词的整数（如“两所”“三轮”），保留字面值，不换算为阿拉伯数字。
# 不识别裸数字、中文小数/分数、财务大写；避免从“第三点五轮”等小数尾部提取。
# 单独的“一”加量词（“一个”“一次”“一年”“第一次”）不识别：它在中文里多是泛指或语气成分，增删它通常不是数量变化。
# “一所”改“两所”仍会因新增“两所”被提示；“十一个”“一百个”照常识别。
# 数字比较前做规范化：全角数字、全角百分号、全角小数点转半角，负号统一为 -、正号统一为 +（保留正号），删除内部空格。
citation_bracket = '\[\d+(?:\s*[,，\-–]\s*\d+)*\]'
citation_author_year = '[（(][^（）()]{1,30}?[,，]\s*\d{4}[a-z]?[）)]'
numbers = '(?:(?<![0-9０-９A-Za-zＡ-Ｚａ-ｚ.．])[-+−－＋﹣])?(?<![0-9０-９.．])[0-9０-９]+(?:,[0-9]{3})*(?:[.．][0-9０-９]+)?(?:[eE][-+−]?[0-9]+|\s*[×xX]\s*10\^[-+−]?[0-9]+)?\s*(?:%|％|‰|倍|年|月|日|个|人|名|项|篇|次|所|万|亿)?|(?<![零〇一二两三四五六七八九十百千万亿点分之壹贰叁肆伍陆柒捌玖拾佰仟])(?:负|正)?(?!一\s*(?:个小时|小时|分钟|个人|个月|年|月|日|天|轮|所|个|人|名|项|篇|次|组|例|倍|秒|米|克|岁))[零〇一二两三四五六七八九十百千万亿]+\s*(?:个小时|小时|分钟|个人|个月|年|月|日|天|轮|所|个|人|名|项|篇|次|组|例|倍|秒|米|克|岁)'
