[project]
name = "acceptance-desk"
version = "0.0.1"
description = "AI 改稿验收台：检查 agent 对中文论文的批量修改，挑出改变论证的高风险修改交给人决定"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "timnie" }]
# 核心审计与冻结分类器使用标准库。工作台和 MCP 分别通过 web、mcp 可选依赖启用。
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# 两个现成模型只用来提取特征；装不上时自动退回“只用规则”模式
models = [
    "torch>=2.6",  # transformers 加载 .bin 时要求 torch>=2.6（torch.load weights_only 安全加载）
    "transformers>=4.40",
    "sentence-transformers>=2.7",
]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]
web = [
    "nicegui>=3.18",  # 事务编辑区的就绪信号，保证弹窗可靠聚焦
]

[project.scripts]
acceptance-desk = "acceptance_desk.cli:main"
acceptance-desk-export = "acceptance_desk.feedback_cli:main"
acceptance-desk-mcp = "mcp_server:main"

[dependency-groups]
desktop = [
    "pyinstaller>=6.20,<7; sys_platform == 'darwin' or sys_platform == 'win32'",
    "pywebview>=6.2,<7; sys_platform == 'darwin' or sys_platform == 'win32'",
]
desktop-test = ["playwright==1.60.0; sys_platform == 'win32'"]
# uv run 默认装 dev 组；pip 用户用上面的 .[dev]。experiments/ 的试标、评测、训练脚本需要 numpy、scikit-learn、joblib
dev = ["pytest>=8", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acceptance_desk", "workbench", "review_ui"]

[tool.hatch.build.targets.wheel.force-include]
"mcp_server.py" = "mcp_server.py"
"examples/original.txt" = "workbench/examples/original.txt"
"examples/revised.txt" = "workbench/examples/revised.txt"
"examples/long_original.txt" = "workbench/examples/long_original.txt"
"examples/long_revised.txt" = "workbench/examples/long_revised.txt"
